name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Build PlayCanvas Editor
              run: bun run build

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Run Linter
              run: bun run lint

            - name: Run Formatter
              run: bun run fmt

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0

            - name: Install Dependencies
              run: bun install --frozen-lockfile

            - name: Run Editor Tests
              run: bun run test

            - name: Run Editor API Module Tests
              run: bun run test:api
