name: Test Suite / CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: test-suite
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - run: bun install --frozen-lockfile
            - run: bun run type:check

    lint:
        name: Lint
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: test-suite
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - run: bun install --frozen-lockfile
            - run: bun run lint
